<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 710" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="u1-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="710" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="700" fill="#1f2328">Use case 1 - migrate a real legacy site</text>
  <text x="40" y="65" font-size="12.5" fill="#57606a">A real migration: Katie's Travel Journal (2004) → the Wilderness Journal (2026). No content generation - migration + evals only.</text>

  <rect x="976" y="22" width="88" height="22" rx="5" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.2"/>
  <text x="1020" y="37" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="600">Human</text>
  <rect x="1072" y="22" width="80" height="22" rx="5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2"/>
  <text x="1112" y="37" font-size="11" fill="#a40e26" text-anchor="middle" font-weight="600">Agentic</text>
  <rect x="1160" y="22" width="104" height="22" rx="5" fill="#edf5ff" stroke="#0969da" stroke-width="1.2"/>
  <text x="1212" y="37" font-size="11" fill="#0a5bd3" text-anchor="middle" font-weight="600">Deterministic</text>

  <!-- lanes -->
  <rect x="40" y="88" width="1200" height="144" rx="10" fill="#fafbfc" stroke="#8c959f" stroke-width="1"/>
  <text x="56" y="112" font-size="12" font-weight="700" fill="#1f2328">HUMAN</text>
  <text x="56" y="130" font-size="10" fill="#6e7781">chooses + judges</text>
  <rect x="40" y="244" width="1200" height="144" rx="10" fill="#fff5f5" stroke="#e0a9a9" stroke-width="1"/>
  <text x="56" y="268" font-size="12" font-weight="700" fill="#a40e26">AGENTIC</text>
  <text x="56" y="286" font-size="10" fill="#8a5050">does the work</text>
  <rect x="40" y="400" width="1200" height="144" rx="10" fill="#f5faff" stroke="#a9c9e8" stroke-width="1"/>
  <text x="56" y="424" font-size="12" font-weight="700" fill="#0a5bd3">DETERMINISTIC</text>
  <text x="56" y="442" font-size="10" fill="#4a6285">routes, records, measures</text>

  <!-- c1 Human: trigger -->
  <rect x="190" y="108" width="195" height="108" rx="9" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.4"/>
  <text x="204" y="130" font-size="12" font-weight="700" fill="#1f2328">Trigger the lane</text>
  <text x="204" y="150" font-size="10.5" fill="#414a55">paste 2-3 legacy article URLs</text>
  <text x="204" y="166" font-size="10.5" fill="#414a55">folder travel-journal-&lt;date&gt;</text>
  <text x="204" y="182" font-size="10.5" fill="#414a55">backend opencode · model k3</text>
  <text x="204" y="198" font-size="10.5" fill="#414a55">evaluate-after ON</text>

  <!-- c2 Det: route -->
  <rect x="400" y="420" width="195" height="108" rx="9" fill="#edf5ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="414" y="442" font-size="12" font-weight="700" fill="#0a5bd3">Route + fan out</text>
  <text x="414" y="462" font-size="10.5" fill="#33445c">goal auto ⇒ migrate → evaluate</text>
  <text x="414" y="478" font-size="10.5" fill="#33445c">ONE branch per URL</text>
  <text x="414" y="494" font-size="10.5" fill="#33445c">slug derived from each URL</text>
  <text x="414" y="510" font-size="10.5" fill="#33445c">one contextId across it all</text>

  <!-- c3 Agentic: migrate -->
  <rect x="610" y="264" width="195" height="108" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.4"/>
  <text x="624" y="286" font-size="12" font-weight="700" fill="#a40e26">K3 authors each page</text>
  <text x="624" y="306" font-size="10.5" fill="#5c3434">reads the source (Playwright)</text>
  <text x="624" y="322" font-size="10.5" fill="#5c3434">skill + da.live MCP (S2S write)</text>
  <text x="624" y="338" font-size="10.5" fill="#5c3434">preview-publish → .aem.page</text>
  <text x="624" y="354" font-size="10.5" fill="#5c3434">self-validates + refines</text>

  <!-- c4 Agentic: eval + Det: tools -->
  <rect x="820" y="264" width="195" height="108" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.4"/>
  <text x="834" y="286" font-size="12" font-weight="700" fill="#a40e26">Redesign eval (agentic)</text>
  <text x="834" y="306" font-size="10.5" fill="#5c3434">did the meaning survive?</text>
  <text x="834" y="322" font-size="10.5" fill="#5c3434">is the layout truly EDS?</text>
  <text x="834" y="338" font-size="10.5" fill="#5c3434">per-dimension scores +</text>
  <text x="834" y="354" font-size="10.5" fill="#5c3434">mode badges + findings</text>

  <rect x="820" y="420" width="195" height="108" rx="9" fill="#edf5ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="834" y="442" font-size="12" font-weight="700" fill="#0a5bd3">Eval's tool floor</text>
  <text x="834" y="462" font-size="10.5" fill="#33445c">axe-core scan (real Chromium)</text>
  <text x="834" y="478" font-size="10.5" fill="#33445c">source↔target screenshots</text>
  <text x="834" y="494" font-size="10.5" fill="#33445c">text-overlap diff</text>
  <text x="834" y="510" font-size="10.5" fill="#33445c">tools can't be charmed</text>

  <!-- c5 Det: record + Human: review -->
  <rect x="1030" y="420" width="195" height="108" rx="9" fill="#edf5ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="1044" y="442" font-size="12" font-weight="700" fill="#0a5bd3">Durable record</text>
  <text x="1044" y="462" font-size="10.5" fill="#33445c">variance μ ± σ, pass rate</text>
  <text x="1044" y="478" font-size="10.5" fill="#33445c">run detail ALWAYS renders</text>
  <text x="1044" y="494" font-size="10.5" fill="#33445c">(store-backed - survives</text>
  <text x="1044" y="510" font-size="10.5" fill="#33445c">restarts and redeploys)</text>

  <rect x="1030" y="108" width="195" height="108" rx="9" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.4"/>
  <text x="1044" y="130" font-size="12" font-weight="700" fill="#1f2328">Review the result</text>
  <text x="1044" y="150" font-size="10.5" fill="#414a55">branch grid + evidence panel</text>
  <text x="1044" y="166" font-size="10.5" fill="#414a55">side-by-side: 2004 vs 2026</text>
  <text x="1044" y="182" font-size="10.5" fill="#414a55">same words, 22 years newer</text>
  <text x="1044" y="198" font-size="10.5" fill="#414a55">preview only, never live</text>

  <!-- arrows -->
  <path d="M 385 162 L 393 162 L 393 474 L 400 474" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#u1-ar)"/>
  <path d="M 595 474 L 603 474 L 603 318 L 610 318" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#u1-ar)"/>
  <path d="M 805 318 L 820 318" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#u1-ar)"/>
  <path d="M 917 420 L 917 376" stroke="#57606a" stroke-width="1.3" fill="none" marker-end="url(#u1-ar)"/>
  <text x="927" y="404" font-size="9.5" fill="#57606a">blend</text>
  <path d="M 1015 340 L 1022 340 L 1022 474 L 1030 474" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#u1-ar)"/>
  <path d="M 1127 420 L 1127 380 L 1127 220" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#u1-ar)"/>

  <!-- callout -->
  <rect x="40" y="562" width="1200" height="42" rx="8" fill="#e9f5ee" stroke="#1a7f37" stroke-width="1.1"/>
  <text x="640" y="580" font-size="11" fill="#2f4a3a" text-anchor="middle">source: Katie's Travel Journal - a hand-built 2004 table-layout blog on jackzhaojin.com/adapt-to-2026-demo · target: the Wilderness Journal on da.live,</text>
  <text x="640" y="596" font-size="11" fill="#2f4a3a" text-anchor="middle">a dated folder per batch on main--adapt-to-2026-demo--jackzhaojin.aem.page - test runs never collide</text>

  <line x1="40" y1="626" x2="1240" y2="626" stroke="#d0d7de"/>
  <text x="40" y="650" font-size="12" fill="#414a55"><tspan font-weight="700">Where the human sits:</tspan> at both ends - chooses the work, judges the result. Everything between is unattended.</text>
  <text x="40" y="672" font-size="12" fill="#414a55"><tspan font-weight="700">Run rule:</tspan> a real agentic turn takes 13-20 minutes, so start the run and review the latest completed one while it works. A failed branch is an observability record, not a crisis.</text>
</svg>
