<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 710" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="u5-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="710" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="700" fill="#1f2328">Use case 5 - eval as a quality gate for someone else's pipeline (concept)</text>
  <text x="40" y="65" font-size="12.5" fill="#57606a">An external publishing flow rents ONE agent from the mesh. Humans see only the verdicts that don't deserve automatic trust.</text>

  <rect x="912" y="22" width="88" height="22" rx="5" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.2"/>
  <text x="956" y="37" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="600">Human</text>
  <rect x="1008" y="22" width="80" height="22" rx="5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2"/>
  <text x="1048" y="37" font-size="11" fill="#a40e26" text-anchor="middle" font-weight="600">Agentic</text>
  <rect x="1096" y="22" width="104" height="22" rx="5" fill="#edf5ff" stroke="#0969da" stroke-width="1.2"/>
  <text x="1148" y="37" font-size="11" fill="#0a5bd3" text-anchor="middle" font-weight="600">Deterministic</text>
  <rect x="1208" y="22" width="56" height="22" rx="5" fill="#faf5ff" stroke="#8250df" stroke-width="1.2"/>
  <text x="1236" y="37" font-size="11" fill="#6639ba" text-anchor="middle" font-weight="600">Mix</text>

  <!-- lanes -->
  <rect x="40" y="88" width="1200" height="144" rx="10" fill="#fafbfc" stroke="#8c959f" stroke-width="1"/>
  <text x="56" y="112" font-size="12" font-weight="700" fill="#1f2328">HUMAN</text>
  <text x="56" y="130" font-size="10" fill="#6e7781">exceptions only</text>
  <rect x="40" y="244" width="1200" height="144" rx="10" fill="#fff5f5" stroke="#e0a9a9" stroke-width="1"/>
  <text x="56" y="268" font-size="12" font-weight="700" fill="#a40e26">AGENTIC</text>
  <text x="56" y="286" font-size="10" fill="#8a5050">measures</text>
  <rect x="40" y="400" width="1200" height="144" rx="10" fill="#f5faff" stroke="#a9c9e8" stroke-width="1"/>
  <text x="56" y="424" font-size="12" font-weight="700" fill="#0a5bd3">DETERMINISTIC</text>
  <text x="56" y="442" font-size="10" fill="#4a6285">gates + routes attention</text>

  <!-- c1 external caller -->
  <rect x="190" y="420" width="195" height="108" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/>
  <text x="204" y="442" font-size="12" font-weight="700" fill="#57606a">An external pipeline</text>
  <text x="204" y="462" font-size="10.5" fill="#414a55">any CMS flow, CI job, or</text>
  <text x="204" y="478" font-size="10.5" fill="#414a55">Make.com scenario - one flat</text>
  <text x="204" y="494" font-size="10.5" fill="#414a55">POST /hooks/eval/eval.run +</text>
  <text x="204" y="510" font-size="10.5" fill="#414a55">callbackUrl (never speaks A2A)</text>

  <!-- c2 Mix: eval (deterministic tools + agentic judgment) -->
  <rect x="400" y="264" width="195" height="108" rx="9" fill="#faf5ff" stroke="#8250df" stroke-width="1.4"/>
  <text x="414" y="286" font-size="12" font-weight="700" fill="#6639ba">The 4-dimension eval</text>
  <text x="414" y="306" font-size="10.5" fill="#5a4a7a">deterministic tools + agentic</text>
  <text x="414" y="322" font-size="10.5" fill="#5a4a7a">judgment on the candidate</text>
  <text x="414" y="338" font-size="10.5" fill="#5a4a7a">page; every score carries its</text>
  <text x="414" y="354" font-size="10.5" fill="#5a4a7a">mode badge + findings</text>

  <!-- c3 Det: policy gate -->
  <rect x="610" y="420" width="195" height="108" rx="9" fill="#edf5ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="624" y="442" font-size="12" font-weight="700" fill="#0a5bd3">The policy gate</text>
  <text x="624" y="462" font-size="10.5" fill="#33445c">score ≥ threshold AND mode</text>
  <text x="624" y="478" font-size="10.5" fill="#33445c">agentic AND variance low</text>
  <text x="624" y="494" font-size="10.5" fill="#33445c">⇒ auto-pass, webhook the</text>
  <text x="624" y="510" font-size="10.5" fill="#33445c">verdict back - no human</text>

  <!-- c4 Human: exceptions -->
  <rect x="820" y="108" width="195" height="108" rx="9" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.4"/>
  <text x="834" y="130" font-size="12" font-weight="700" fill="#1f2328">Exceptions only</text>
  <text x="834" y="150" font-size="10.5" fill="#414a55">low score, fallback mode, or</text>
  <text x="834" y="166" font-size="10.5" fill="#414a55">high variance ⇒ escalate;</text>
  <text x="834" y="182" font-size="10.5" fill="#414a55">the Evidence panel is the</text>
  <text x="834" y="198" font-size="10.5" fill="#414a55">case file - accept or override</text>

  <!-- c5 Det: audit -->
  <rect x="1030" y="420" width="195" height="108" rx="9" fill="#edf5ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="1044" y="442" font-size="12" font-weight="700" fill="#0a5bd3">The audit trail</text>
  <text x="1044" y="462" font-size="10.5" fill="#33445c">every verdict durable: report,</text>
  <text x="1044" y="478" font-size="10.5" fill="#33445c">mode, screenshots, findings -</text>
  <text x="1044" y="494" font-size="10.5" fill="#33445c">"why did we ship this?" has</text>
  <text x="1044" y="510" font-size="10.5" fill="#33445c">an answer, months later</text>

  <!-- arrows -->
  <path d="M 385 474 L 393 474 L 393 318 L 400 318" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#u5-ar)"/>
  <path d="M 595 318 L 603 318 L 603 474 L 610 474" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#u5-ar)"/>
  <path d="M 805 474 L 1030 474" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#u5-ar)"/>
  <text x="917" y="466" font-size="9.5" fill="#57606a" text-anchor="middle">auto-pass (most of the time)</text>
  <path d="M 707 420 L 707 162 L 820 162" stroke="#a40e26" stroke-width="1.4" fill="none" marker-end="url(#u5-ar)"/>
  <text x="700" y="256" font-size="9.5" fill="#a40e26" text-anchor="end">only the suspect verdicts</text>
  <path d="M 1015 162 L 1022 162 L 1022 420 L 1030 420" stroke="#57606a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#u5-ar)"/>
  <text x="1024" y="300" font-size="9.5" fill="#57606a">logged</text>

  <!-- callout -->
  <rect x="40" y="562" width="1200" height="42" rx="8" fill="#e9f5ee" stroke="#1a7f37" stroke-width="1.1"/>
  <text x="640" y="580" font-size="11" fill="#2f4a3a" text-anchor="middle">the escalation signals already exist in every report - mode, confidence, variance, grade. The gate is a small policy over data the eval</text>
  <text x="640" y="596" font-size="11" fill="#2f4a3a" text-anchor="middle">already emits; no new agent required. The edge shim means the caller needs one POST and one webhook - nothing more.</text>

  <line x1="40" y1="626" x2="1240" y2="626" stroke="#d0d7de"/>
  <text x="40" y="650" font-size="12" fill="#414a55"><tspan font-weight="700">Where the human sits:</tspan> almost nowhere - and that's the design. Routing every verdict to a person trains them to rubber-stamp; routing only the suspect ones keeps their judgment worth something.</text>
  <text x="40" y="672" font-size="12" fill="#414a55"><tspan font-weight="700">The mesh as a product:</tspan> one agent, rented à la carte. The other three agents never wake up.</text>
</svg>
