<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 710" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="u3-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="710" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="700" fill="#1f2328">Use case 3 - the weekly trend scout (concept)</text>
  <text x="40" y="65" font-size="12.5" fill="#57606a">The generator standing alone: research the week's hiking trends and deliver a digest. No migration, no EDS - the brief itself is the product.</text>

  <rect x="976" y="22" width="88" height="22" rx="5" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.2"/>
  <text x="1020" y="37" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="600">Human</text>
  <rect x="1072" y="22" width="80" height="22" rx="5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2"/>
  <text x="1112" y="37" font-size="11" fill="#a40e26" text-anchor="middle" font-weight="600">Agentic</text>
  <rect x="1160" y="22" width="104" height="22" rx="5" fill="#edf5ff" stroke="#0969da" stroke-width="1.2"/>
  <text x="1212" y="37" font-size="11" fill="#0a5bd3" text-anchor="middle" font-weight="600">Deterministic</text>

  <!-- lanes -->
  <rect x="40" y="88" width="1200" height="144" rx="10" fill="#fafbfc" stroke="#8c959f" stroke-width="1"/>
  <text x="56" y="112" font-size="12" font-weight="700" fill="#1f2328">HUMAN</text>
  <text x="56" y="130" font-size="10" fill="#6e7781">sets policy, reads</text>
  <rect x="40" y="244" width="1200" height="144" rx="10" fill="#fff5f5" stroke="#e0a9a9" stroke-width="1"/>
  <text x="56" y="268" font-size="12" font-weight="700" fill="#a40e26">AGENTIC</text>
  <text x="56" y="286" font-size="10" fill="#8a5050">researches + distills</text>
  <rect x="40" y="400" width="1200" height="144" rx="10" fill="#f5faff" stroke="#a9c9e8" stroke-width="1"/>
  <text x="56" y="424" font-size="12" font-weight="700" fill="#0a5bd3">DETERMINISTIC</text>
  <text x="56" y="442" font-size="10" fill="#4a6285">schedules + delivers</text>

  <!-- c1 Det: weekly cadence -->
  <rect x="190" y="420" width="195" height="108" rx="9" fill="#edf5ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="204" y="442" font-size="12" font-weight="700" fill="#0a5bd3">Weekly cadence</text>
  <text x="204" y="462" font-size="10.5" fill="#33445c">cron, Monday mornings -</text>
  <text x="204" y="478" font-size="10.5" fill="#33445c">the watch-list config: feeds,</text>
  <text x="204" y="494" font-size="10.5" fill="#33445c">forums, trail reports, gear</text>
  <text x="204" y="510" font-size="10.5" fill="#33445c">sites, permit bulletins</text>

  <!-- c2 Agentic: research sweep -->
  <rect x="400" y="264" width="195" height="108" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.4"/>
  <text x="414" y="286" font-size="12" font-weight="700" fill="#a40e26">Research sweep</text>
  <text x="414" y="306" font-size="10.5" fill="#5c3434">aggregate the week's signals:</text>
  <text x="414" y="322" font-size="10.5" fill="#5c3434">trail conditions + closures,</text>
  <text x="414" y="338" font-size="10.5" fill="#5c3434">gear releases, permit changes,</text>
  <text x="414" y="354" font-size="10.5" fill="#5c3434">what hikers are asking about</text>

  <!-- c3 Agentic: synthesize -->
  <rect x="610" y="264" width="195" height="108" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.4"/>
  <text x="624" y="286" font-size="12" font-weight="700" fill="#a40e26">Synthesize</text>
  <text x="624" y="306" font-size="10.5" fill="#5c3434">content.brief as the product:</text>
  <text x="624" y="322" font-size="10.5" fill="#5c3434">"what moved this week, and</text>
  <text x="624" y="338" font-size="10.5" fill="#5c3434">why it matters" - sources</text>
  <text x="624" y="354" font-size="10.5" fill="#5c3434">cited, topics ranked</text>

  <!-- c4 Det: deliver -->
  <rect x="820" y="420" width="195" height="108" rx="9" fill="#edf5ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="834" y="442" font-size="12" font-weight="700" fill="#0a5bd3">Deliver</text>
  <text x="834" y="462" font-size="10.5" fill="#33445c">digest artifact → public R2</text>
  <text x="834" y="478" font-size="10.5" fill="#33445c">URL, linked from the run row</text>
  <text x="834" y="494" font-size="10.5" fill="#33445c">no migration, no EDS write -</text>
  <text x="834" y="510" font-size="10.5" fill="#33445c">the same store, a new product</text>

  <!-- c5 Human: read + steer -->
  <rect x="1030" y="108" width="195" height="108" rx="9" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.4"/>
  <text x="1044" y="130" font-size="12" font-weight="700" fill="#1f2328">Read + steer</text>
  <text x="1044" y="150" font-size="10.5" fill="#414a55">skim the digest over coffee;</text>
  <text x="1044" y="166" font-size="10.5" fill="#414a55">star the topics worth writing -</text>
  <text x="1044" y="182" font-size="10.5" fill="#414a55">stars feed the daily loop's</text>
  <text x="1044" y="198" font-size="10.5" fill="#414a55">ideation queue</text>

  <!-- arrows -->
  <path d="M 385 474 L 393 474 L 393 318 L 400 318" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#u3-ar)"/>
  <path d="M 595 318 L 610 318" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#u3-ar)"/>
  <path d="M 805 318 L 813 318 L 813 474 L 820 474" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#u3-ar)"/>
  <path d="M 1015 474 L 1022 474 L 1022 162 L 1030 162" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#u3-ar)"/>

  <!-- feedback loop -->
  <path d="M 1127 216 L 1127 238 L 287 238 L 287 420" stroke="#1f2328" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#u3-ar)"/>
  <text x="707" y="233" font-size="10" fill="#1f2328" text-anchor="middle" font-style="italic">steering: starred topics update the watch-list + editorial lane - the human's standing control, not a gate in the flow</text>

  <!-- callout -->
  <rect x="40" y="562" width="1200" height="42" rx="8" fill="#e9f5ee" stroke="#1a7f37" stroke-width="1.1"/>
  <text x="640" y="580" font-size="11" fill="#2f4a3a" text-anchor="middle">the decoupling payoff: this is the SAME content-gen agent the closed loop uses - same skills, same store, same A2A card -</text>
  <text x="640" y="596" font-size="11" fill="#2f4a3a" text-anchor="middle">pointed at a different consumer. Swap "migration" for "newsletter" and nothing about the agent changes.</text>

  <line x1="40" y1="626" x2="1240" y2="626" stroke="#d0d7de"/>
  <text x="40" y="650" font-size="12" fill="#414a55"><tspan font-weight="700">Where the human sits:</tspan> nowhere in the flow - and that's deliberate. The human owns the standing policy (which lanes, which sources) and consumes the output.</text>
  <text x="40" y="672" font-size="12" fill="#414a55"><tspan font-weight="700">Same mesh, new shape:</tspan> a generate-only route with no migration and no eval - the route table already allows it; the mesh has no mandatory start or end.</text>
</svg>
